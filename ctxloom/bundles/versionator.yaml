version: 1.0.0
tags:
    - versioning
    - semver
    - release
author: ctxloom
description: Semantic versioning and release cycle management
notes: |
    Release workflow and versioning prompts for use with versionator tool.
prompts:
    release:
        description: Release workflow for versionator projects
        tags:
            - versioning
            - release
            - workflow
        content: |-
            Release workflow for versionator. User MUST specify version.

            User input: $ARGUMENTS
            - Fixed version: "0.1.0", "1.0.0", "2.3.4"
            - Bump instruction: "patch", "minor", "major"

            If no version specified, STOP and ask the user. Do not guess.

            Steps:
            1. Parse user input for version or bump instruction
            2. Stage all changes: `git add -A`
            3. Analyze changes and create appropriate conventional commit message
            4. If bump instruction (patch/minor/major):
               - Commit with appropriate conventional prefix (fix:/feat:/feat!:)
               - Run `./versionator bump` to increment and amend
            5. If fixed version (X.Y.Z):
               - Write version to VERSION file
               - Commit with version in message
            6. Run `./versionator release push` to create the tag and release
               branch AND push them to origin in one atomic step.

            CRITICAL — ALWAYS use `versionator release push`. Never use
            `versionator release` alone, and never substitute raw
            `git push origin <tag>` / `git push origin <branch>`.
            - `versionator release` only creates the local tag and branch; it
              does NOT publish them. Splitting create-and-push lets the local
              and remote drift (e.g. a tag created locally then never pushed
              becomes an orphan that conflicts with future `release push`
              attempts).
            - `release push` is the single source of truth for "this version
              is now public." Downstream automation that fires on a tag-push
              event (GitHub Releases, release-completer workflows, deploy
              pipelines, artifact builds) only fires reliably when the tag
              and the branch land on origin together.
            - If you have already created the tag/branch locally with bare
              `release`, run `versionator release push --force` to reconcile,
              then push the underlying commit (`git push origin main`).

            IMPORTANT: Never auto-select version. User must explicitly specify.
        content_hash: ""
        distilled: |-
            # release

            Release workflow for versionator. User MUST specify version.

            Input: $ARGUMENTS
            - Fixed: "0.1.0", "1.0.0"
            - Bump: "patch", "minor", "major"

            No version → STOP and ask. Never guess.

            Steps:
            1. Parse input
            2. `git add -A`
            3. Create conventional commit
            4. Bump instruction: commit w/ fix:/feat:/feat!:, run `./versionator bump`, amend
            5. Fixed version: write VERSION, commit
            6. `./versionator release push` → atomic tag+branch+push to origin

            ALWAYS use `release push`. Never `release` alone, never raw
            `git push origin <tag>`. `release` without `push` only creates
            local refs — downstream automation (GitHub Releases, release
            completers, deploy pipelines) only fires on the tag-push event.
            If you already ran bare `release`, recover with
            `release push --force` then `git push origin main`.
        distilled_by: claude-3-opus
    suggest-version:
        description: Display current version and suggest next version based on changes
        tags:
            - versioning
            - semver
            - analysis
        content: |-
            Analyze the repository and suggest the next semantic version.

            Steps:
            1. Read the current version from VERSION file
            2. Get changes since last tag using `git log --oneline $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD`
            3. Analyze the commit messages and code changes

            Display format:
            ```
            Current version: X.Y.Z
            Commits since last release: N

            Changes:
            - [list key changes]

            Suggested next version: X.Y.Z
            Reasoning: [explanation based on semver]
            ```

            Semver rules:
            - MAJOR (X): Breaking API changes, incompatible modifications
            - MINOR (Y): New backward-compatible features, significant enhancements
            - PATCH (Z): Bug fixes, minor improvements, documentation

            Pre-1.0 rules:
            - Breaking changes can be MINOR (0.X.0)
            - Features can be PATCH (0.0.X)

            Be conservative: when uncertain, suggest the lower bump level.

            This prompt only suggests — it does not execute. When the user
            asks to actually cut the release, hand off to the `release`
            prompt, which mandates `versionator release push` (NOT bare
            `versionator release`, and NOT raw `git push` of the tag).
        content_hash: ""
        distilled: |-
            # suggest-version

            Analyze repo, suggest next semver.

            Steps:
            1. Read VERSION file
            2. Get changes: `git log --oneline $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD`
            3. Analyze commits/changes

            Output:
            ```
            Current version: X.Y.Z
            Commits since last release: N
            Changes: [list]
            Suggested next version: X.Y.Z
            Reasoning: [semver basis]
            ```

            Semver:
            - MAJOR: Breaking/incompatible changes
            - MINOR: New backward-compatible features
            - PATCH: Bug fixes, docs, minor improvements

            Pre-1.0:
            - Breaking → MINOR (0.X.0)
            - Features → PATCH (0.0.X)

            When uncertain, suggest lower bump.

            Suggest only — does not execute. To cut the release, hand off
            to `release`, which mandates `versionator release push`.
        distilled_by: claude-3-opus
    version-bump:
        description: Determine appropriate version bump
        tags:
            - versioning
            - semver
        content: |-
            Analyze these changes and recommend the appropriate semantic version bump:

            Current version: {{version}}

            Changes:
            {{changes}}

            Consider:
            - Are there breaking API changes? → major
            - New backward-compatible features? → minor
            - Bug fixes only? → patch
            - Is this pre-1.0? Different rules apply

            Recommend version and explain reasoning.

            This prompt only recommends — it does not execute the bump.
            When the user wants to actually cut the release, invoke the
            `release` prompt, which mandates `versionator release push`
            (NOT bare `versionator release`, and NOT a manual sequence of
            `versionator bump` + `versionator release` + raw `git push`,
            which leaves the local tag/branch and the remote out of sync).
        content_hash: ""
