description: 'Source tree organization conventions: <repo>/main for the primary checkout, <repo>/<branch-or-worktree-name> for additional git worktrees'
fragments:
    source-organization:
        tags:
        - source-organization
        - git
        - worktree
        - layout
        installation: |-
            This bundle is a workspace layout convention. There are no harness rules to add — the convention is enforced by where you clone repos and where you place worktrees.

            Existing repos that are checked out at `<parent>/<repo>` (a single directory containing the working tree) should be migrated:

            1. Move the working tree to `<repo>/main`:
               ```
               mv <repo> <repo>.tmp
               mkdir <repo>
               mv <repo>.tmp <repo>/main
               ```
            2. Update any tooling, IDE projects, or shell aliases that referenced the old path.
            3. From `<repo>/main`, add additional worktrees with the layout below.

            Do not migrate repos used by other tools without checking them first; some build systems hard-code paths.
        content: |-
            # Git Worktree Layout

            For a repository named `<repo>`, organize checkouts as:

            ```
            <repo>/
              main/              # primary checkout, tracks main/master
              <branch-name>/     # additional worktree for a branch
              <feature-x>/       # additional worktree
            ```

            The repository name is a **parent directory**. The primary checkout lives at `<repo>/main` — never clone `<repo>/` as a flat checkout. Every additional worktree (feature branch, hotfix, review checkout, scratch branch) is a sibling directory under `<repo>/`, named to match the branch or the worktree's purpose.

            For branches with `/` in the name (e.g. `feature/auth`), slugify to a filesystem-friendly directory name (e.g. `feature-auth`); the branch name itself is unchanged, only the directory is.

            Never remove a worktree with `--force` unless the user explicitly asks — it discards uncommitted changes.

            ## Common Mistakes

            - Cloning to `<repo>/` directly (flat) — convert to `<repo>/main` before adding worktrees
            - Adding a worktree nested inside main (`<repo>/main/<branch>`) or outside `<repo>/` — siblings of `main` only
            - Reusing a directory name from a deleted worktree without first running `git worktree prune`
        content_hash: sha256:227d8f72266ab3a01be857949ebc19e3dac6990e136a4f911f4bb53384be89ee
