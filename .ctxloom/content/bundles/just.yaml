version: 1.0.0
commands:
    tooling:
        description: Tools this bundle's content needs where agents run (applied via `ctxloom tooling`, user-approved)
        tags:
            - tooling
        content: |
            - just: every recipe in this bundle assumes the `just` task
              runner. Homebrew (`brew install just`), a distro package, or a
              pinned release from https://github.com/casey/just/releases.
