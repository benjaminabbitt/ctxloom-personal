author: "ctxloom"
description: "Developer mindset practices for communication, quality validation, and informed reimplementation"

fragments:
  close-the-turn:
    tags:
      - workflow
      - quality
    premise: "You are finishing a turn, or you have surfaced something you are not going to fix right now. For anyone about to leave an issue unresolved, or about to report what happened."
    notes: |-
      Defends against the most polished failure a work session has: the closing
      report that mentions every problem and disposes of none. A finding named in a
      reply feels handled — it was communicated — but nothing downstream reads
      replies, so the issue is lost the moment the session ends. Hence the
      fragment's central claim that there are exactly two honest dispositions,
      fixed or filed-with-context, and "mentioned it" is neither. The
      status-hygiene half exists for the complementary failure: a task log that is
      only mostly true is worse than none, because the stale entries read with
      exactly the same authority as the live ones — a task carrying its completed
      half looks identical to work never started, and a closed-but-unrecorded fix
      gets done twice.
    content: |-
      # Closing a turn: fix what you can, file what you cannot

      Before a turn ends, every issue it surfaced has to be DISPOSED OF. There
      are exactly two honest dispositions, and "mentioned it in the reply" is
      neither.

      ## Fix the easy ones

      If a finding is root-caused and the fix is bounded, FIX IT. Filing a task
      for something you already understand and could correct in the same turn
      converts a solved problem into work someone pays to rediscover: they must
      re-read the code, rebuild the reproduction, and re-derive the cause you
      already had in hand.

      A filed task looks like progress. It is not progress; it is a promise.
      Prefer the fix, and where the fix is larger than the turn, dispatch it
      rather than defer it.

      ## File the hard ones, with tags

      File when the work genuinely cannot happen now: it needs a HUMAN DECISION
      (name the fork and the options), it lives in another repository or
      release, or it is materially larger than the current scope. Those are real
      reasons. "I noticed several things" is not.

      Tag what you file, because an untagged task is unfindable: what kind of
      work it is, what it touches, its rough effort, and whether it is blocked
      on a person. A task nobody can filter for is a task nobody reads.

      ## Leave the status TRUE

      The task log and the plans are the shared picture of where things stand,
      and a stale picture is worse than none because it is confidently wrong.
      Before the turn closes:

      - Close what the turn actually finished, stating what was asked for and
        what was done, so a reader can judge rather than take your word.
      - Where a change satisfies a task only in PART, cut the task down to what
        REMAINS. A task carrying its own completed half is indistinguishable
        from work never started.
      - Update the plan files the turn moved, including where reality diverged
        from the plan. The divergence is the most valuable thing in them.
      - Check for tasks the turn quietly obsoleted, and for duplicates you may
        have just created by filing before reading.

      ## Report what was FIXED

      Lead with what is now true, not with what was noticed. A list of filed
      tasks is not a status report: it is a list of things still broken, and
      reading it as accomplishment is how a backlog grows while the code stands
      still.

  sunk-cost:
    tags:
      - workflow
      - refactoring
      - quality
    content: |-
      # Sunk cost: don't

      We do not preserve things because they are written.

      Existing work is not an argument for keeping it. The only questions are what it
      buys NOW and what it costs to carry from here.

      ## The tell

      You are arguing from sunk cost whenever the case for keeping something is a
      fact about its HISTORY rather than its value:

      - "it already exists and works"
      - "it's already tested and green"
      - "we already paid for this"
      - "someone put real effort into this"

      Every one of those can be true while the thing still fails to earn its place.

      ## The question that settles it

      **If it did not exist, would you write it today for what it buys?**

      If the honest answer is no, delete it. The effort is spent either way. The only
      decision still open is whether to keep paying to carry the result.

      Answer it with a measurement where you can. "It saves some calls" loses to "it
      saves four calls a session, against two lookup tables nothing validates".

      ## It applies past code

      Prose, plans, tests, config keys, abstractions, whole features. A test that
      proves nothing does not earn its place by being green. A doc nobody maintains
      does not earn its place by having been written. An abstraction with one caller
      does not earn its place by having been designed.

      Deleting is not the waste. Carrying something that does not earn its place is,
      and unlike the original effort that cost is still ahead of you.

      ## Watch for it in your own recommendations

      The failure is rarely someone defending old code on principle. It is a
      recommendation whose real support is that the work is already done, dressed up
      as a judgement about value. When you catch yourself recommending "keep" and the
      strongest thing you can say is that it already works, you have found one.

      See also elegant-redo, for what to do with what a discarded attempt taught you
      — the knowledge is the output worth keeping, not the code.
  elegant-redo:
    tags:
      - workflow
      - refactoring
      - quality
    content: |-
      # Elegant Redo: Informed Reimplementation

      Discard the current implementation and start fresh, using everything learned during the first attempt to produce an elegant solution.

      ## Philosophy

      The first implementation teaches you the problem. The second implementation solves it well. The knowledge gained from wrestling with edge cases, discovering hidden requirements, and hitting dead ends is the most valuable output of a first attempt - not the code itself.

      ## Process

      1. **Inventory what you know now** - Before deleting anything, document:
         - Hidden requirements discovered during implementation
         - Edge cases that surprised you
         - Architectural constraints revealed by the problem
         - Dependencies and interfaces that must be preserved
         - What worked well and should be kept conceptually
         - What was over-engineered or unnecessarily complex

      2. **Identify the elegant core** - With full knowledge of the problem:
         - What is the simplest abstraction that covers all known cases?
         - What data structures naturally fit the problem?
         - Where did the first attempt fight the language/framework instead of working with it?
         - What can be deleted entirely vs what is essential?

      3. **Scrap and rebuild** - Start clean:
         - Do not copy-paste from the old implementation
         - Write fresh code informed by lessons learned
         - Let the structure emerge from the problem, not from the previous solution
         - Apply reductive principles - less code, fewer abstractions, simpler interfaces

      4. **Validate** - Ensure the new solution:
         - Handles all edge cases discovered in the first attempt
         - Passes existing tests (or improved versions of them)
         - Is demonstrably simpler (fewer lines, fewer abstractions, clearer flow)

      ## When This Applies

      - The current implementation works but feels forced or over-complicated
      - You've discovered the real shape of the problem and the code doesn't match it
      - Accumulated patches have obscured the original design intent
      - The developer explicitly requests a fresh take with accumulated knowledge

      ## Rules

      - Do not preserve code out of sunk cost - judge everything on current merit
      - Simpler is better, but not at the cost of correctness
      - The goal is elegance: the minimum structure that handles the full problem naturally
      - Keep tests - they encode requirements. Rewrite implementation, not specifications.
